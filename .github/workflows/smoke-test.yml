name: Smoke test APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build APK]
    types: [completed]

jobs:
  launch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Baixar APK da release
        run: curl -sL -o GlowStudio.apk https://github.com/${{ github.repository }}/releases/download/apk-latest/GlowStudio.apk

      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r GlowStudio.apk
            adb logcat -c
            adb shell monkey -p com.aistudio.glowstudio.vkprsz -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > errors.txt || true
            adb shell pidof com.aistudio.glowstudio.vkprsz > pid.txt || true
            echo "=== CRASH ==="; cat crash.txt; echo "=== PID ==="; cat pid.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            crash.txt
            errors.txt
            pid.txt
