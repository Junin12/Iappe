name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # O repositório não versiona a debug.keystore; o build.gradle espera uma na raiz.
      - name: Gerar debug.keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlowStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlowStudio-apk
          path: GlowStudio.apk

      - name: Publicar release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GlowStudio APK (mais recente)
          body: APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
          files: GlowStudio.apk
          make_latest: true
