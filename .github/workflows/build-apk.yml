name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # A mesma chave em todo build: sem isso o Android recusa instalar a versão nova por cima.
      - name: Restaurar debug.keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_B64 ausente. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlowStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlowStudio-apk
          path: GlowStudio.apk

      - name: Publicar release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GlowStudio APK (mais recente)
          body: APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
          files: GlowStudio.apk
          make_latest: true
